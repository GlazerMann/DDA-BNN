version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

    cooldown:
      default-days: 5

    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: conda
    directory: /
    schedule:
      interval: daily

    cooldown:
      default-days: 5

    groups:
      conda-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
